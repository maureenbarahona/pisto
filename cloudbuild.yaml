steps:
  # 1. Ejecutar pruebas unitarias e integración antes de construir la imagen
  - name: 'node:22-alpine'
    entrypoint: 'npm'
    args: ['test']

  # 2. Construir imagen Docker optimizada para Cloud Run
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/one-money-finance:$BUILD_ID'
      - '.'

  # 3. Subir imagen al registro del proyecto
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/one-money-finance:$BUILD_ID'

  # 4. Desplegar servicio en Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'one-money-finance'
      - '--image'
      - 'gcr.io/$PROJECT_ID/one-money-finance:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '3'

images:
  - 'gcr.io/$PROJECT_ID/one-money-finance:$BUILD_ID'
